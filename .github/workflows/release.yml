name: Desktop release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac
            arch: arm64
            extension: dmg
          - runner: macos-15
            platform: mac
            arch: x64
            extension: dmg
          - runner: windows-2022
            platform: win
            arch: x64
            extension: exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build -- --${{ matrix.platform }} --${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: ProjectManage-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/ProjectManage-*.${{ matrix.extension }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum installers/* | sed 's|  installers/|  |' > installers/SHA256SUMS.txt
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" installers/* --clobber
          else
            gh release create "$RELEASE_TAG" installers/* --verify-tag \
              --title "ProjectManage $RELEASE_TAG" \
              --notes "Windows x64 및 macOS Apple Silicon·Intel용 설치 파일입니다. 현재 설치 파일에는 배포자 코드 서명이 적용되어 있지 않습니다."
          fi
