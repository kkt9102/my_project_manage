name: Desktop release

on:
  push:
    tags: ['v*', 'build/v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac
            arch: arm64
            extension: dmg
          - runner: macos-15
            platform: mac
            arch: x64
            extension: dmg
          - runner: windows-2022
            platform: win
            arch: x64
            extension: exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build desktop packages
        shell: bash
        run: |
          options=()
          if [[ "$GITHUB_REF_NAME" == build/* ]]; then
            revision=${GITHUB_REF_NAME##*-}
            [[ "$revision" =~ ^[0-9a-f]{7,40}$ ]]
            options+=("--config.extraMetadata.buildRevision=build.$revision")
          fi
          npm run build -- --${{ matrix.platform }} --${{ matrix.arch }} "${options[@]}"
      - name: Verify Windows archive
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem -Path dist -Filter 'ProjectManage-*-win-x64.zip')
          if ($archives.Count -ne 1) { throw 'Expected one Windows ZIP archive.' }
          $archive = [System.IO.Compression.ZipFile]::OpenRead($archives[0].FullName)
          try {
            $executables = @($archive.Entries | Where-Object { $_.Name -eq 'ProjectManage.exe' })
            $payloads = @($archive.Entries | Where-Object { $_.FullName -match '(^|[\\/])resources[\\/]app\.asar$' })
            if ($executables.Count -ne 1 -or $payloads.Count -ne 1 -or $executables[0].Length -eq 0 -or $payloads[0].Length -eq 0) {
              throw 'The Windows ZIP does not contain a runnable ProjectManage bundle.'
            }
          } finally {
            $archive.Dispose()
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ProjectManage-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/ProjectManage-*.${{ matrix.extension }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'win'
        with:
          name: ProjectManage-win-x64-zip
          path: dist/ProjectManage-*-win-x64.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" == build/* ]]; then
            build_ref=${RELEASE_TAG#build/}
            version_tag=${build_ref%-*}
            revision=${build_ref##*-}
            [[ "$version_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$revision" =~ ^[0-9a-f]{7,40}$ ]]
            prefix="ProjectManage-${version_tag#v}-"
            for file in installers/"$prefix"*; do
              name=${file##*/}
              mv "$file" "installers/${prefix}build.${revision}-${name#"$prefix"}"
            done
            sums="SHA256SUMS-build.${revision}.txt"
            files=(installers/*)
            sha256sum "${files[@]}" | sed 's|  installers/|  |' > "installers/$sums"
            gh release upload "$version_tag" installers/*
            exit 0
          fi
          sha256sum installers/* | sed 's|  installers/|  |' > installers/SHA256SUMS.txt
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" installers/* --clobber
          else
            gh release create "$RELEASE_TAG" installers/* --verify-tag \
              --title "ProjectManage $RELEASE_TAG" \
              --notes "Windows x64 설치 파일·무설치 ZIP 및 macOS Apple Silicon·Intel용 DMG를 제공합니다. 현재 배포 파일에는 배포자 코드 서명이 적용되어 있지 않습니다."
          fi
